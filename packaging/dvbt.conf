# /etc/tv-channel-dvbt/dvbt.conf
#
# Sourced (`.`) by /usr/lib/tv-channel-dvbt/{relay,transmit}-wrapper.sh.
# This is plain POSIX shell, NOT systemd EnvironmentFile syntax -- quote
# any value containing spaces the same way you would in a shell script.

# MUST match your country's real terrestrial DVB-T standard, or no real TV
# will ever decode this. 8MHz is the UK/most-of-Europe standard and is what
# this project validated end-to-end (GNU Radio -> HackRF -> a real TV).
# Only change this if your own country's broadcast standard genuinely uses
# a different bandwidth -- see the README before touching this.
BANDWIDTH_HZ=8000000
CENTER_FREQ_HZ=610000000
TX_GAIN=40

# --- Network plumbing between ffplayout and GNU Radio ---
FFPLAYOUT_MULTICAST_ADDR=239.1.1.1
FFPLAYOUT_MULTICAST_PORT=5000
RELAY_LISTEN_PORT=6000

# 40 packets/7520 bytes has confirmed margin above the 8MHz underrun cliff
# measured at 34-35 packets/~6.4-6.6KB on this project's Pi 4 + HackRF One.
# If you see continuous DVB-T underruns on different hardware, raise this.
PACKETS_PER_DATAGRAM=40

# Advanced: only set this if you also change the modulation profile
# (2K/QPSK/CR1-2/GI1-4) in the flowgraph itself. Leave unset (commented
# out) to auto-derive from BANDWIDTH_HZ.
#TARGET_BITRATE_BPS=
